# git-cliff configuration
# Docs: https://git-cliff.org/docs/configuration
# Output follows Keep a Changelog (https://keepachangelog.com/en/1.1.0/)

[changelog]
# Rendered before the first version entry.
header = """
# Changelog

All notable changes to PERO-J are documented here.
Format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
This project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

# Tera template for each version section.
body = """
{% if version %}\
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING** {% endif %}\
{{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`](../../commit/{{ commit.id }}))\
{% if commit.body %}

  {{ commit.body | trim | indent(prefix="  ") }}
{% endif %}
{% endfor %}
{% endfor %}\n
"""

# Appended after all version sections.
footer = ""

# Remove leading/trailing whitespace from the template output.
trim = true

[git]
# Parse commits that follow Conventional Commits.
conventional_commits = true

# Drop commits that do not match any commit_parsers below.
filter_unconventional = true

# Split a commit with multiple footers (BREAKING CHANGE) into multiple entries.
split_commits = false

# Regex to post-process each commit message before grouping.
commit_preprocessors = [
  # Strip trailing period.
  { pattern = '\.$', replace = "" },
  # Linkify GitHub issue references.
  { pattern = '#(\d+)', replace = "[#${1}](../../issues/${1})" },
]

# Map conventional commit types to changelog section headings.
commit_parsers = [
  { message = "^feat",     group = "Features"         },
  { message = "^fix",      group = "Bug Fixes"        },
  { message = "^perf",     group = "Performance"      },
  { message = "^refactor", group = "Refactoring"      },
  { message = "^test",     group = "Testing"          },
  { message = "^docs",     group = "Documentation"    },
  { message = "^ci",       group = "CI / CD"          },
  { message = "^chore",    group = "Miscellaneous"    },
  { message = "^revert",   group = "Reverts"          },
  # Merge commits are noise — drop them.
  { message = "^Merge",    skip = true                },
  # Generic README bumps are noise — drop them.
  { message = "^Update README", skip = true           },
]

# Protect breaking changes from being skipped.
protect_breaking_commits = true

# Only include commits reachable from HEAD (no orphan branches).
filter_commits = false

# Sort versions using semantic versioning rules.
tag_pattern = "v[0-9]*"

# Ignore pre-release tags when building the changelog.
skip_tags = "v0\\.0\\.0"

# Do not include commits that come after the latest tag in the
# [Unreleased] section (keep it clean in automation).
ignore_tags = ""

# Order sections newest-first.
topo_order = false
sort_commits = "newest"
